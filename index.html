<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片尺寸修改器</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 50px auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        input[type="file"] {
            margin: 20px 0;
        }
        input[type="number"] {
            padding: 8px;
            margin: 10px;
            width: 150px;
            text-align: center;
        }
        canvas {
            max-width: 100%;
            margin-top: 20px;
            border: 1px solid #ddd;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>图片尺寸修改器</h1>
        <p>请选择一张图片并调整尺寸（宽度和高度）：</p>
        
        <!-- 上传图片 -->
        <input type="file" id="imageInput" accept="image/*">
        
        <!-- 宽度和高度 -->
        <br>
        <input type="number" id="widthInput" placeholder="宽度" min="1">
        <input type="number" id="heightInput" placeholder="高度" min="1">
        
        <!-- 修改按钮 -->
        <br>
        <button onclick="resizeImage()">修改尺寸</button>
        
        <!-- 显示图片和修改后的结果 -->
        <div id="output">
            <canvas id="canvas"></canvas>
        </div>
    </div>

    <script>
        let imageElement = new Image();
        let canvas = document.getElementById('canvas');
        let ctx = canvas.getContext('2d');

        // 处理图片加载
        document.getElementById('imageInput').addEventListener('change', (event) => {
            let file = event.target.files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    imageElement.src = e.target.result;
                    imageElement.onload = function() {
                        canvas.width = imageElement.width;
                        canvas.height = imageElement.height;
                        ctx.drawImage(imageElement, 0, 0);
                    }
                };
                reader.readAsDataURL(file);
            }
        });

        // 修改尺寸
        function resizeImage() {
            let width = parseInt(document.getElementById('widthInput').value);
            let height = parseInt(document.getElementById('heightInput').value);

            if (isNaN(width) || isNaN(height) || width <= 0 || height <= 0) {
                alert('请输入有效的宽度和高度');
                return;
            }

            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 设置画布尺寸并重新绘制图片
            canvas.width = width;
            canvas.height = height;
            ctx.drawImage(imageElement, 0, 0, width, height);
        }
    </script>
</body>
</html>
